<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Dashboard financiero · Fachavi</title>
  <link rel="stylesheet" href="/dashboard-assets/styles.css?v=__DASHBOARD_ASSET_VERSION__">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Fachavi · Control financiero</p>
        <h1 id="cliente">Dashboard financiero</h1>
        <p id="periodo" class="periodo"></p>
      </div>
      <div class="hero-acciones">
        <label class="selector-vista" for="agrupar-gastos">
          Ver gastos por
          <select id="agrupar-gastos">
            <option value="categoria">Categoría</option>
            <option value="medio_pago">Método de pago</option>
          </select>
        </label>
        <button id="agregar-movimiento" class="agregar-movimiento" type="button" hidden>＋ Agregar movimiento</button>
        <div class="estado"><span></span> Datos verificados</div>
      </div>
    </header>

    <section id="resumen" class="cards" aria-label="Resumen"></section>
    <section id="presupuesto" class="panel presupuesto" hidden></section>
    <section id="indicadores" class="indicadores"></section>
    <section class="panel chat-dashboard" aria-labelledby="chat-titulo">
      <div class="chat-cabecera">
        <div>
          <h2 id="chat-titulo">Pregúntale a Fachavi</h2>
          <p>Comparte el mismo contexto de tu conversación en WhatsApp.</p>
        </div>
        <span class="chat-contexto">Contexto compartido</span>
      </div>
      <div id="chat-mensajes" class="chat-mensajes" role="log" aria-live="polite" aria-label="Conversación"></div>
      <form id="chat-formulario" class="chat-formulario">
        <label class="sr-only" for="chat-entrada">Escribe tu consulta</label>
        <textarea id="chat-entrada" rows="2" maxlength="4000" placeholder="Ej.: ¿cuánto gasté este mes?"></textarea>
        <button id="chat-enviar" type="submit">Enviar</button>
      </form>
      <p id="chat-error" class="chat-error" hidden></p>
    </section>

    <footer>
      <span id="actualizado"></span>
      <span>Edición y creación de movimientos disponible</span>
    </footer>
  </main>
  <script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
  <script src="/dashboard-assets/app.js?v=__DASHBOARD_ASSET_VERSION__" defer></script>
</body>
</html>
