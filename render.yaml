# FASE 2 — INGESTA. Un solo servicio por ahora.
#
# El bot de WhatsApp se agrega despues (type: web). Hoy nos enfocamos en que la
# data entre bien al warehouse.
#
# COMO PROBAR SIN TERMINAL:
#   1. Deja SYNC_ARGS = --probar  (extrae y muestra, NO escribe nada)
#   2. En el dashboard de Render: "Trigger Run" y revisa los Logs
#   3. Si las columnas se ven bien, cambia SYNC_ARGS a vacio y ya escribe
#   4. El schedule se encarga del resto

services:
  - type: cron
    name: fachavi-ingesta
    runtime: python
    plan: starter
    # UTC. Costa Rica = UTC-6 (las 6am ticas son las 12:00 UTC).
    # Cada 15 min: la columna 'frescura_minutos' de cada fuente decide
    # si de verdad sincroniza o se omite. Un cron, N frecuencias.
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements-ingesta.txt
    startCommand: python sync.py
    envVars:
      # Modo de corrida. Se cambia desde el dashboard sin tocar codigo:
      #   --probar  -> no escribe (para validar antes de automatizar)
      #   (vacio)   -> corrida normal, respeta frescura
      #   --forzar  -> ignora frescura y recarga todo
      #   --estado  -> solo muestra cuando cargo cada fuente
      - key: SYNC_ARGS
        value: --probar
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: MASTER_SPREADSHEET_ID
        sync: false
      - key: WAREHOUSE_TIPO
        value: postgres
      - key: WAREHOUSE_DSN
        sync: false
